name: Build distributable GHMod

on:
  push:
    branches: [main]
    paths:
      - 'P2PSpawnFix.cs'
      - 'P2PSpawnFixHelp.txt'
      - 'modinfo.json'
      - 'icon.png'
      - 'banner.jpg'
      - '.github/workflows/build-ghmod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deterministic GHMod
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          files=(
            P2PSpawnFix.cs
            P2PSpawnFixHelp.txt
            modinfo.json
            icon.png
            banner.jpg
          )
          touch -t 200001010000 "${files[@]}"
          rm -f dist/modinstaller.p2p-spawn-fix.ghmod
          zip -X -j -q dist/modinstaller.p2p-spawn-fix.ghmod "${files[@]}"

      - name: Commit distributable when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/modinstaller.p2p-spawn-fix.ghmod
          if git diff --cached --quiet; then
            echo "GHMod already current."
            exit 0
          fi
          git commit -m "build: update distributable ghmod [skip ci]"
          git push
